name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.24'

      - name: Build all platforms
        run: |
          version="${GITHUB_REF_NAME#v}"
          ldflags="-s -w -X github.com/chriskarabinis/sek/cmd.version=${version}"
          for target in darwin/amd64 darwin/arm64 linux/amd64 linux/arm64; do
            goos="${target%/*}"; goarch="${target#*/}"
            GOOS="$goos" GOARCH="$goarch" go build -ldflags="$ldflags" -o "sek_${goos}_${goarch}" .
          done

      - name: Generate checksums
        run: sha256sum sek_* > checksums.txt

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            sek_darwin_amd64
            sek_darwin_arm64
            sek_linux_amd64
            sek_linux_arm64
            checksums.txt
          generate_release_notes: true
